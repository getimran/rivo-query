spring:
  application:
    name: rivoquery-api
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  shutdown: graceful

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        exclude: "*"

logging:
  level:
    com.zaxxer.hikari.pool.ProxyConnection: ERROR
  structured:
    format:
      console: ecs
