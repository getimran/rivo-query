name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            .mvn/wrapper/maven-wrapper.properties
            pom.xml
            apps/api/pom.xml

      - name: Verify Docker for Testcontainers
        run: docker info --format '{{.ServerVersion}}'

      - name: Run backend unit and integration checks
        run: ./mvnw -f apps/api/pom.xml --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up the reviewed npm release
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          test "$(npm --version)" = "11.19.0"

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Verify reviewed dependency install scripts
        run: npm --prefix apps/web run install-scripts:check

      - name: Check generated API client drift
        run: npm --prefix apps/web run api:check

      - name: Lint frontend
        run: npm --prefix apps/web run lint

      - name: Test frontend
        run: npm --prefix apps/web run test

      - name: Build frontend
        run: npm --prefix apps/web run build

  compose:
    name: Validate local Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f deploy/local/compose.yaml config --quiet

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: 8.30.1
